<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 — BuBye GradSchool</title>
<link rel="stylesheet" href="https://use.typekit.net/src5zzp.css"/>
<link rel="icon" type="image/svg+xml" href="Favicon.svg"/>
<style>
:root {
  --blue: #2E4ED2;
  --off:  #F5F5EF;
}

*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

html, body { height: 100%; -webkit-text-size-adjust: 100%; }

body {
  background: var(--blue);
  color: var(--off);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100svh;
  padding: 2.5rem 2rem;
  text-align: center;
  overflow-x: hidden;
  gap: 0;
}

.content {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: up 0.7s ease both;
}

.eyebrow {
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 0.72rem;
  font-weight: 400;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--off);
  opacity: 0.35;
  margin-bottom: 1.5rem;
}

.error-code {
  font-family: 'beastly', sans-serif;
  font-weight: 700;
  font-size: clamp(6rem, 25vw, 16rem);
  line-height: 0.85;
  color: var(--off);
  opacity: 0.1;
  letter-spacing: -0.02em;
  margin-bottom: -1rem;
  position: relative;
  z-index: 0;
}

.headline {
  font-family: 'beastly', sans-serif;
  font-weight: 700;
  font-size: clamp(2.5rem, 9vw, 7rem);
  line-height: 0.92;
  color: var(--off);
  letter-spacing: -0.01em;
  margin-bottom: 1.75rem;
  position: relative;
  z-index: 1;
}

.subtext {
  font-family: 'Helvetica Neue', sans-serif;
  font-size: clamp(0.85rem, 2.2vw, 1rem);
  line-height: 1.8;
  color: var(--off);
  opacity: 0.5;
  max-width: 400px;
  margin-bottom: 2.5rem;
}

.btn {
  display: inline-block;
  padding: 0.9rem 2.5rem;
  background: var(--off);
  color: var(--blue);
  font-family: 'Helvetica Neue', sans-serif;
  font-weight: 700;
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-decoration: none;
  border-radius: 4px;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }

.footer-text {
  margin-top: 4rem;
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 0.72rem;
  color: var(--off);
  opacity: 0.2;
  letter-spacing: 0.05em;
}

@keyframes up {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  body { padding: 2rem 1.5rem; }
  .error-code { margin-bottom: -0.5rem; }
}
</style>
</head>
<body>

  <div class="content">
    <p class="eyebrow">error 404</p>
    <div class="error-code">404</div>
    <h1 class="headline">This page<br/>moved out.</h1>
    <p class="subtext">
      Looks like this page has already packed up and left, no forwarding address, no goodbye note. Unlike our stuff, it's gone for good.
    </p>
    <a class="btn" href="index.html">Go Back Home</a>
    <p class="footer-text">BYEBYE - COCREATED BY A&amp;S UMSI 2026</p>
  </div>

</body>
</html>
